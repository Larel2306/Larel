<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020b12"><title>My Account | LAREL</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Larel2306/Larel/main/Larel.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#020b12;color:#f7fbff;font-family:'Plus Jakarta Sans',sans-serif}
.topbar{height:76px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #00d2ff25;background:#07101b}
.logo{font-size:24px;font-weight:800;letter-spacing:2px;color:#fff;text-decoration:none}.logo span{color:#00d2ff}
.top-actions{display:flex;gap:10px;align-items:center}.top-actions a,.top-actions button{border:1px solid #00d2ff45;background:#00d2ff0d;color:#fff;border-radius:22px;padding:10px 15px;text-decoration:none;font-size:12px;font-weight:700;cursor:pointer}
main{width:min(1100px,92%);margin:42px auto 70px}.welcome{margin-bottom:28px}.eyebrow{color:#00d2ff;font-size:11px;font-weight:800;letter-spacing:3px}.welcome h1{font-size:clamp(27px,5vw,40px);margin:10px 0}.welcome p{color:#9aabba;font-size:14px}
.grid{display:grid;grid-template-columns:330px 1fr;gap:20px}.panel{background:linear-gradient(145deg,#101c2a,#0a1420);border:1px solid #ffffff18;border-radius:20px;padding:24px}.panel h2{font-size:18px;margin:0 0 20px}.profile-row{padding:13px 0;border-bottom:1px solid #ffffff12}.profile-row:last-child{border:0}.profile-row small{display:block;color:#8293a7;font-size:11px;margin-bottom:5px}.profile-row strong{font-size:14px;overflow-wrap:anywhere}.order-card{padding:16px;border:1px solid #ffffff16;border-radius:14px;margin-bottom:12px;background:#07111b}.order-card h3{font-size:14px;margin:0 0 8px}.order-card p{font-size:12px;color:#a4b3c3;margin:0}.empty-orders{text-align:center;padding:42px 15px;color:#a4b3c3}.empty-orders i{font-size:32px;color:#00d2ff;margin-bottom:15px}.empty-orders h3{color:#fff}.empty-orders p{font-size:13px;line-height:1.7}.empty-orders a{display:inline-block;margin-top:12px;background:#00d2ff;color:#041019;text-decoration:none;border-radius:22px;padding:11px 18px;font-size:12px;font-weight:800}
@media(max-width:760px){.grid{grid-template-columns:1fr}.topbar{padding:0 4%;height:66px}.logo{font-size:20px}main{margin-top:28px}.panel{padding:20px}}
</style>
</head>
<body id="larelAccountPage">
<header class="topbar"><a class="logo" href="index.html">LAREL<span>.</span></a><div class="top-actions"><a href="Shop.html">Shop</a><button id="accountLogoutBtn" type="button">Log out</button></div></header>
<main>
<section class="welcome"><div class="eyebrow">MY LAREL ACCOUNT</div><h1 id="customerWelcome">Welcome back</h1><p>Manage your profile and keep track of your LAREL orders.</p></section>
<div class="grid">
<section class="panel"><h2><i class="fa-regular fa-user"></i> Profile details</h2>
<div class="profile-row"><small>Name</small><strong id="profileName">—</strong></div>
<div class="profile-row"><small>Mobile No.</small><strong id="profilePhone">—</strong></div>
<div class="profile-row"><small>Signup method</small><strong id="profileMethod">—</strong></div>
</section>
<section class="panel"><h2><i class="fa-solid fa-box"></i> My Orders</h2><div id="ordersList"><div class="empty-orders">Loading your orders…</div></div></section>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="notifications.js"></script><script src="auth.js"></script>
</body></html>
