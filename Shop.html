<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAREL - Luxury Store</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
  background: #0b0b0e;
  color: #f3f3f6;
  padding-top: 80px;
  padding-bottom: 50px;
  overflow-x: hidden;
}

.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 16px 5%;
  background: rgba(10,10,14,.9);
  backdrop-filter: blur(14px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 2000;
  border-bottom: 1px solid #ffffff14;
}

.logo {
  font-size: 24px;
  font-weight: 800;
  color: #fff;
  text-decoration: none;
  letter-spacing: 2.5px;
}

.nav-links {
  display: flex;
  list-style: none;
  gap: 28px;
}

.nav-links a {
  color: #ddd;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
}

.nav-links a:hover,
.nav-links a.active {
  color: #fff;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-icon-btn {
  color: #fff;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #ffffff12;
  padding: 9px 14px;
  border-radius: 30px;
  border: 1px solid #ffffff1c;
  font-size: 14px;
  position: relative;
}

.cart-count {
  position: absolute;
  top: -5px;
  right: -5px;
  background: #0ea5e9;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.menu-btn {
  display: none;
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #ffffff12;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 1px solid #ffffff1a;
}

.menu-overlay {
  position: fixed;
  inset: 0;
  background: #000b;
  backdrop-filter: blur(5px);
  z-index: 1998;
  opacity: 0;
  visibility: hidden;
  transition: .25s;
}

.menu-overlay.active {
  opacity: 1;
  visibility: visible;
}

.category-container {
  display: flex;
  justify-content: center;
  padding: 20px 18px;
  overflow-x: auto;
  scrollbar-width: none;
}

.category-container::-webkit-scrollbar {
  display: none;
}

.category-menu {
  display: flex;
  gap: 7px;
  background: #16161de0;
  padding: 6px;
  border-radius: 40px;
  border: 1px solid #ffffff1a;
}

.category-item {
  color: #a0a0ab;
  font-size: 13px;
  font-weight: 700;
  padding: 10px 19px;
  border-radius: 30px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}

.category-item.active {
  color: #000;
  background: #fff;
}

.tab-content {
  display: none;
  width: 100%;
}

.tab-content.active {
  display: block;
}

/* Snitch Style Mobile Grid Responsiveness */
.product-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 22px;
  padding: 0 40px;
}

.product-card {
  background: #ffffff08;
  border-radius: 18px;
  overflow: hidden;
  color: inherit;
  border: 1px solid #ffffff12;
  transition: .25s;
  cursor: pointer;
  display: block;
  min-width: 0;
}

.product-card:hover {
  transform: translateY(-4px);
  border-color: #ffffff40;
}

.product-image {
  width: 100%;
  aspect-ratio: 1 / 1.08;
  overflow: hidden;
  position: relative;
  background: #15151a;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: .4s;
}

.product-card:hover .product-image img {
  transform: scale(1.035);
}

.badge-tag {
  position: absolute;
  top: 12px;
  left: 12px;
  background: #000b;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 5px 9px;
  border-radius: 20px;
  text-transform: uppercase;
  z-index: 2;
}

.wishlist-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #0009;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  cursor: pointer;
}

.product-info {
  padding: 15px;
}

/* Rating Stars */
.product-rating {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  font-size: 12px;
  color: #fbbf24;
}

.product-rating span {
  color: #9ca3af;
  font-weight: 600;
  font-size: 11px;
}

.product-title {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 8px;
}

/* Price row with price on left and pure white plus on opposite right side */
.price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.price-group {
  display: flex;
  gap: 8px;
  align-items: baseline;
  flex-wrap: wrap;
}

.product-price {
  font-size: 17px;
  font-weight: 800;
}

.original-price {
  font-size: 12px;
  color: #777782;
  text-decoration: line-through;
}

/* Pure white plus button with no background */
.pure-plus-btn {
  background: transparent;
  border: none;
  color: #ffffff;
  font-size: 16px;
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}

.pure-plus-btn:hover {
  transform: scale(1.2);
}

.buy-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #0ea5e9;
  color: #fff;
  padding: 10px;
  border-radius: 10px;
  font-weight: 800;
  font-size: 12px;
  width: 100%;
}

/* Toast Notification Styling */
.toast-notification {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: #0ea5e9;
  color: #fff;
  padding: 12px 20px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4);
  z-index: 9999;
  opacity: 0;
  transform: translateY(20px);
  transition: 0.3s ease;
  font-size: 13px;
  font-weight: 700;
}

.toast-notification.show {
  opacity: 1;
  transform: translateY(0);
}

.empty-category {
  grid-column: 1 / -1;
  padding: 45px 20px;
  text-align: center;
  color: #888;
  font-size: 14px;
}

@media(max-width:1023px) {
  .product-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    padding: 0 20px;
  }
}

@media(max-width:768px) {
  .menu-btn {
    display: flex;
  }

  .navbar {
    position: fixed;
    top: 0;
    right: -100%;
    width: 260px;
    height: 100vh;
    background: #111116;
    padding: 80px 24px;
    transition: .25s;
    z-index: 1999;
  }

  .navbar.active {
    right: 0;
  }

  .nav-links {
    flex-direction: column;
    gap: 20px;
  }

  .product-grid {
    padding: 0 8px;
    gap: 8px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .category-container {
    justify-content: flex-start;
    padding: 12px 8px;
  }

  .nav-icon-btn {
    padding: 9px 12px;
  }

  .nav-icon-btn span {
    display: none;
  }
}

@media(max-width:480px) {
  .product-info {
    padding: 10px;
  }

  .product-title {
    font-size: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .product-price {
    font-size: 14px;
  }

  .original-price {
    font-size: 11px;
  }

  .buy-btn {
    font-size: 11px;
    padding: 8px;
  }

  .badge-tag {
    font-size: 9px;
    top: 8px;
    left: 8px;
    padding: 4px 7px;
  }

  .wishlist-btn {
    width: 28px;
    height: 28px;
    top: 8px;
    right: 8px;
    font-size: 12px;
  }

  .category-item {
    padding: 8px 14px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="menu-overlay" id="menu-overlay"></div>

<header class="header">
  <a href="#" class="logo">LAREL</a>

  <nav class="navbar" id="navbar">
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#" class="active">Shop</a></li>
      <li><a href="#">About Us</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <div class="nav-actions">
    <a href="#search" class="nav-icon-btn" aria-label="Search">
      <i class="fa-solid fa-magnifying-glass"></i>
    </a>

    <a href="#" class="nav-icon-btn" id="cart-btn">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Cart</span>
      <div class="cart-count" id="cartCount">0</div>
    </a>

    <div class="menu-btn" id="menu-btn">
      <i class="fa-solid fa-bars"></i>
    </div>
  </div>
</header>

<div class="category-container" id="categoryContainer">
  <div class="category-menu" id="categoryMenu"></div>
</div>

<div id="shopContent"></div>

<script>
const PRODUCTS = [
  {
    cat: "tshirts",
    id: "tshirt1",
    name: "Consistency Beats Perfection Oversized Graphic T-Shirt",
    price: 569,
    mrp: 1199,
    img: "https://i.ibb.co/DDfmmDS7/Untitled-design.png",
    badge: "Bestseller",
    rating: 4.8,
    reviews: 124
  },
  {
    cat: "jackets",
    id: "hoodie1",
    name: "Heavyweight Cotton Oversized Hoodie",
    price: 1299,
    mrp: 2499,
    img: "https://i.ibb.co/HTv05d2p/Screenshot-2026-07-28-201328.png",
    badge: "Hot",
    rating: 4.9,
    reviews: 89
  }
];

const CATEGORIES = [
  { id: "tshirts", label: "T-Shirts" },
  { id: "hoodies", label: "Hoodies" },
  { id: "jackets", label: "Jackets" },
  { id: "bottomwear", label: "Bottomwear" },
  { id: "kidswear", label: "Kids Wear" }
];

let cart = JSON.parse(localStorage.getItem('larel_cart')) || [];

function updateCartCount() {
  document.getElementById('cartCount').textContent = cart.length;
}

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(c) {
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c];
  });
}

function renderShop() {
  document.getElementById("categoryMenu").innerHTML =
    CATEGORIES.map(function(c) {
      return `
        <span class="category-item"
              data-cat="${c.id}"
              onclick="openTab('${c.id}')">
          ${c.label}
        </span>`;
    }).join("");

  document.getElementById("shopContent").innerHTML =
    CATEGORIES.map(function(c) {
      const items = PRODUCTS.filter(function(p) {
        return p.cat === c.id;
      });

      const cards = items.map(function(p) {
        const rating = p.rating || 4.8;
        const reviews = p.reviews || 95;

        return `
          <div class="product-card" onclick="openProductDetail('${safeText(p.id)}')">
            <div class="product-image">
              ${p.badge ? `<span class="badge-tag">${safeText(p.badge)}</span>` : ""}
              <div class="wishlist-btn" onclick="toggleWishlist(event, this)">
                <i class="fa-regular fa-heart"></i>
              </div>
              <img src="${safeText(p.img)}" alt="${safeText(p.name)}" loading="lazy">
            </div>

            <div class="product-info">
              <div class="product-rating">
                <i class="fa-solid fa-star"></i>
                <span>${rating} (${reviews})</span>
              </div>

              <div class="product-title">
                ${safeText(p.name)}
              </div>

              <!-- Price on left and Pure White Plus Button on opposite right side -->
              <div class="price-row">
                <div class="price-group">
                  <span class="product-price">
                    ₹${Number(p.price).toLocaleString("en-IN")}
                  </span>
                  ${p.mrp ? `
                    <span class="original-price">
                      ₹${Number(p.mrp).toLocaleString("en-IN")}
                    </span>` : ""}
                </div>
                <button class="pure-plus-btn" onclick="quickAddToCart(event, '${safeText(p.id)}')" title="Add to Cart">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>

              <div class="buy-btn">
                <i class="fa-solid fa-bag-shopping"></i>
                View Product
              </div>
            </div>
          </div>`;
      }).join("");

      return `
        <section id="${c.id}" class="tab-content">
          <div class="product-grid">
            ${cards || `<p class="empty-category">No products found in ${c.label}.</p>`}
          </div>
        </section>`;
    }).join("");

  updateCartCount();
}

function cleanCategory(category) {
  category = String(category || "tshirts").toLowerCase().trim().replace(/\s+/g, "");
  return CATEGORIES.some(c => c.id === category) ? category : "tshirts";
}

function openTab(name) {
  name = cleanCategory(name);

  document.querySelectorAll(".tab-content").forEach(el => {
    el.classList.toggle("active", el.id === name);
  });

  document.querySelectorAll(".category-item").forEach(el => {
    el.classList.toggle("active", el.dataset.cat === name);
  });
}

function openProductDetail(productId) {
  const product = PRODUCTS.find(p => p.id === productId);
  if (product) {
    alert("Opening product details for: " + product.name);
  }
}

function toggleWishlist(event, element) {
  event.stopPropagation();
  const icon = element.querySelector("i");
  if (icon.classList.contains("fa-regular")) {
    icon.classList.replace("fa-regular", "fa-solid");
    icon.style.color = "#ff4757";
  } else {
    icon.classList.replace("fa-solid", "fa-regular");
    icon.style.color = "#fff";
  }
}

function quickAddToCart(event, productId) {
  event.stopPropagation();
  const product = PRODUCTS.find(p => p.id === productId);
  if (product) {
    cart.push(product);
    localStorage.setItem('larel_cart', JSON.stringify(cart));
    updateCartCount();
    showToast(product.name + " cart mein add ho gaya hai!");
  }
}

function showToast(message) {
  const existing = document.querySelector('.toast-notification');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'toast-notification';
  toast.innerHTML = `<i class="fa-solid fa-check-circle" style="font-size: 16px;"></i> <span>${message}</span>`;
  document.body.appendChild(toast);

  setTimeout(() => toast.classList.add('show'), 100);
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

const menuBtn = document.getElementById("menu-btn");
const navbar = document.getElementById("navbar");
const overlay = document.getElementById("menu-overlay");

function toggleMenu() {
  navbar.classList.toggle("active");
  overlay.classList.toggle("active");
}

menuBtn.addEventListener("click", toggleMenu);
overlay.addEventListener("click", toggleMenu);

renderShop();
openTab("tshirts");
</script>

</body>
</html>
