
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - LAREL</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
  background: #0b0b0e;
  color: #f3f3f6;
  padding-top: 80px;
  padding-bottom: 50px;
  overflow-x: hidden;
}

/* HEADER */
.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 16px 5%;
  background: rgba(10,10,14,.9);
  backdrop-filter: blur(14px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 2000;
  border-bottom: 1px solid #ffffff14;
}

.logo {
  font-size: 24px;
  font-weight: 800;
  color: #fff;
  text-decoration: none;
  letter-spacing: 2.5px;
}

.nav-links {
  display: flex;
  list-style: none;
  gap: 28px;
}

.nav-links a {
  color: #ddd;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
}

.nav-links a:hover,
.nav-links a.active {
  color: #fff;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-icon-btn {
  color: #fff;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #ffffff12;
  padding: 9px 14px;
  border-radius: 30px;
  border: 1px solid #ffffff1c;
  font-size: 14px;
  position: relative;
}

.cart-count {
  position: absolute;
  top: -5px;
  right: -5px;
  background: #0ea5e9;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.menu-btn {
  display: none;
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #ffffff12;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 1px solid #ffffff1a;
}

.menu-overlay {
  position: fixed;
  inset: 0;
  background: #000b;
  backdrop-filter: blur(5px);
  z-index: 1998;
  opacity: 0;
  visibility: hidden;
  transition: .25s;
}

.menu-overlay.active {
  opacity: 1;
  visibility: visible;
}

/* CATEGORIES */
.category-container {
  display: flex;
  justify-content: center;
  padding: 20px 18px;
  overflow-x: auto;
  scrollbar-width: none;
}

.category-container::-webkit-scrollbar {
  display: none;
}

.category-menu {
  display: flex;
  gap: 7px;
  background: #16161de0;
  padding: 6px;
  border-radius: 40px;
  border: 1px solid #ffffff1a;
}

.category-item {
  color: #a0a0ab;
  font-size: 13px;
  font-weight: 700;
  padding: 10px 19px;
  border-radius: 30px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}

.category-item.active {
  color: #000;
  background: #fff;
}

/* PRODUCT GRID */
.tab-content {
  display: none;
  width: 100%;
}

.tab-content.active {
  display: block;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
  padding: 0 40px;
}

.product-card {
  background: transparent;
  border-radius: 0;
  overflow: hidden;
  color: inherit;
  transition: .25s;
  cursor: pointer;
  display: block;
  min-width: 0;
}

/* UPDATED IMAGE BOX: ALL IMAGES FILL THE BOX */
.product-image {
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  position: relative;
  background: #15151a;
  border-radius: 0;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  transition: transform .4s ease;
}

/* Image hover effect */
.product-card:hover .product-image img {
  transform: scale(1.035);
}

/* Product badge */
.badge-tag {
  position: absolute;
  top: 12px;
  left: 12px;
  background: #000b;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 5px 9px;
  border-radius: 20px;
  text-transform: uppercase;
  z-index: 2;
}

/* PRODUCT DETAILS */
.product-info {
  padding: 12px 4px 4px;
}

.product-title {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.35;
  margin-bottom: 8px;
  color: #eaeaf0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.product-price {
  font-size: 16px;
  font-weight: 800;
  color: #fff;
}

.pure-plus-btn {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .2s;
}

.pure-plus-btn:hover {
  transform: scale(1.2);
}

/* TOAST NOTIFICATION */
.toast-notification {
  position: fixed;
  top: 25px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: #0ea5e9;
  color: #fff;
  padding: 14px 24px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 10px 25px rgba(14,165,233,.4);
  z-index: 9999;
  opacity: 0;
  visibility: hidden;
  transition: all .3s ease;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
}

.toast-notification.show {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}

/* PRODUCT OPTIONS MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(5px);
  z-index: 3000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  visibility: hidden;
  transition: .25s ease;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-container {
  background: #141419;
  border: 1px solid #ffffff1a;
  border-radius: 16px;
  width: 100%;
  max-width: 360px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px;
  color: #f3f3f6;
  box-shadow: 0 20px 40px rgba(0,0,0,.6);
  transform: scale(.95);
  transition: .25s ease;
}

.modal-overlay.active .modal-container {
  transform: scale(1);
}

.modal-header {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 10px;
}

.modal-close {
  background: transparent;
  border: none;
  color: #aaa;
  font-size: 18px;
  cursor: pointer;
}

.modal-close:hover {
  color: #fff;
}

.option-group {
  margin-bottom: 12px;
}

.option-label {
  font-size: 11px;
  font-weight: 700;
  color: #888;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.option-values-column {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-btn {
  background: #1e1e24;
  border: 1px solid #ffffff22;
  color: #fff;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: .2s;
  text-align: left;
  width: 100%;
}

.option-btn:hover {
  border-color: #0ea5e9;
  background: #25252c;
}

.empty-category {
  grid-column: 1 / -1;
  padding: 45px 20px;
  text-align: center;
  color: #888;
  font-size: 14px;
}

/* TABLET */
@media(max-width:1023px) {
  .product-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    padding: 0 20px;
  }
}

/* MOBILE */
@media(max-width:768px) {
  .menu-btn {
    display: flex;
  }

  .navbar {
    position: fixed;
    top: 0;
    right: -100%;
    width: 260px;
    max-width: 85vw;
    height: 100vh;
    background: #111116;
    padding: 80px 24px;
    transition: .25s;
    z-index: 1999;
  }

  .navbar.active {
    right: 0;
  }

  .nav-links {
    flex-direction: column;
    gap: 20px;
  }

  .product-grid {
    padding: 0 8px;
    gap: 14px 8px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .category-container {
    justify-content: flex-start;
    padding: 12px 8px;
  }

  .nav-icon-btn {
    padding: 9px 12px;
  }

  .nav-icon-btn span {
    display: none;
  }
}

/* SMALL MOBILE */
@media(max-width:480px) {
  .header {
    padding: 12px 4%;
  }

  .logo {
    font-size: 21px;
  }

  .product-info {
    padding: 8px 2px;
  }

  .product-title {
    font-size: 11.5px;
  }

  .product-price {
    font-size: 14px;
  }

  .badge-tag {
    font-size: 9px;
    top: 8px;
    left: 8px;
    padding: 4px 7px;
  }

  .category-item {
    padding: 8px 14px;
    font-size: 12px;
  }

  .product-image {
    aspect-ratio: 3 / 4;
  }
}
</style>
</head>

<body>

<div class="menu-overlay" id="menu-overlay"></div>

<!-- PRODUCT OPTIONS MODAL -->
<div class="modal-overlay" id="productModalOverlay">
  <div class="modal-container" id="modalContainer">
    <div class="modal-header">
      <button class="modal-close"
              onclick="closeProductModal()"
              aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div id="modalOptionsContent"></div>
  </div>
</div>

<!-- HEADER -->
<header class="header">
  <a href="https://lakhangoyal2306-wq.github.io/Larel/Home"
     class="logo">LAREL</a>

  <nav class="navbar" id="navbar">
    <ul class="nav-links">
      <li><a href="https://lakhangoyal2306-wq.github.io/Larel/Home">Home</a></li>
      <li><a href="https://lakhangoyal2306-wq.github.io/Larel/Shop"
             class="active">Shop</a></li>
      <li><a href="https://lakhangoyal2306-wq.github.io/Larel/About">About us</a></li>
      <li><a href="https://lakhangoyal2306-wq.github.io/Larel/Contact">Contact</a></li>
    </ul>
  </nav>

  <div class="nav-actions">
    <a href="#search" class="nav-icon-btn" aria-label="Search">
      <i class="fa-solid fa-magnifying-glass"></i>
    </a>

    <a href="https://lakhangoyal2306-wq.github.io/Larel/Cart"
       class="nav-icon-btn" id="cart-btn">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Cart</span>
      <div class="cart-count" id="cartCount">0</div>
    </a>

    <button class="menu-btn" id="menu-btn" aria-label="Open menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
</header>

<!-- CATEGORY MENU -->
<div class="category-container" id="categoryContainer">
  <div class="category-menu" id="categoryMenu"></div>
</div>

<!-- PRODUCTS -->
<div id="shopContent"></div>

<!-- TOAST -->
<div class="toast-notification" id="toastNotification">
  <i class="fa-solid fa-check-circle" style="font-size:18px"></i>
  <span id="toastMessage">Added to cart successfully!</span>
</div>

<script>
/* =================================
   PRODUCT DATA
================================= */

const PRODUCTS = [
  {
    cat: "tshirts",
    id: "tshirt1",
    name: "Consistency Beats Perfection Oversized Graphic T-Shirt",
    price: 569,
    img: "https://i.ibb.co/0VKMwf9C/Untitled-design.png",
    colors: ["Black", "White", "Navy Blue"],
    sizes: ["S", "M", "L", "XL", "XXL"]
  },
  {
    cat: "tshirts",
    id: "tshirt2",
    name: "Future Memories – Cyberpunk Graphic Classic Crew Tee",
    price: 539,
    img: "https://i.ibb.co/HTv05d2p/Screenshot-2026-07-28-201328.png",
    colors: ["Grey", "Black", "Royal Blue"],
    sizes: ["S", "M", "L", "XL", "XXL"]
  },
  {
    cat: "tshirts",
    id: "tshirt3",
    name: "Find Your North – Compass Signature T-Shirt",
    price: 499,
    img: "https://i.ibb.co/KjyFcQ9H/Mediterranean-Patio-Portrait-in-White-and-Charcoal.png",
    colors: ["White", "Grey Melange", "Lavender", "Mint"],
    sizes: ["S", "M", "L", "XL", "XXL"]
  }
];

const CATEGORIES = [
  { id: "tshirts", label: "T-Shirts" },
  { id: "hoodies", label: "Hoodies" },
  { id: "jackets", label: "Jackets" },
  { id: "bottomwear", label: "Bottomwear" },
  { id: "kidswear", label: "Kids Wear" }
];

/* =================================
   CART DATA
================================= */

function loadCart() {
  try {
    const savedCart = JSON.parse(localStorage.getItem("larel_cart"));
    return Array.isArray(savedCart) ? savedCart : [];
  } catch (error) {
    return [];
  }
}

let cart = loadCart();
let activeSelectedProduct = null;
let tempSelectedColor = null;

/* =================================
   HELPERS
================================= */

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(c) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c];
  });
}

function updateCartCount() {
  document.getElementById("cartCount").textContent = cart.length;
}

/* =================================
   RENDER SHOP
================================= */

function renderShop() {
  document.getElementById("categoryMenu").innerHTML =
    CATEGORIES.map(function(category) {
      return `
        <span class="category-item"
              data-cat="${category.id}"
              onclick="openTab('${category.id}')">
          ${safeText(category.label)}
        </span>
      `;
    }).join("");

  document.getElementById("shopContent").innerHTML =
    CATEGORIES.map(function(category) {
      const items = PRODUCTS.filter(function(product) {
        return product.cat === category.id;
      });

      const cards = items.map(function(product) {
        return `
          <div class="product-card"
               onclick="openProductDetail('${safeText(product.id)}')">

            <div class="product-image">
              ${product.badge
                ? `<span class="badge-tag">${safeText(product.badge)}</span>`
                : ""}

              <img
                src="${safeText(product.img)}"
                alt="${safeText(product.name)}"
                loading="lazy"
                onerror="this.onerror=null;this.style.visibility='hidden';this.parentElement.style.background='#22222a';"
              >
            </div>

            <div class="product-info">
              <div class="product-title">
                ${safeText(product.name)}
              </div>

              <div class="price-row">
                <span class="product-price">
                  ₹${Number(product.price).toLocaleString("en-IN")}
                </span>

                <button
                  type="button"
                  class="pure-plus-btn"
                  onclick="quickAddToCart(event, '${safeText(product.id)}')"
                  title="Add to Cart"
                  aria-label="Add ${safeText(product.name)} to cart">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      return `
        <section id="${category.id}" class="tab-content">
          <div class="product-grid">
            ${cards || `
              <p class="empty-category">
                No products found in ${safeText(category.label)}.
              </p>
            `}
          </div>
        </section>
      `;
    }).join("");

  updateCartCount();
}

/* =================================
   CATEGORY TABS
================================= */

function cleanCategory(category) {
  category = String(category || "tshirts")
    .toLowerCase()
    .trim()
    .replace(/\s+/g, "");

  return CATEGORIES.some(function(item) {
    return item.id === category;
  }) ? category : "tshirts";
}

function openTab(name) {
  name = cleanCategory(name);

  document.querySelectorAll(".tab-content").forEach(function(section) {
    section.classList.toggle("active", section.id === name);
  });

  document.querySelectorAll(".category-item").forEach(function(item) {
    item.classList.toggle("active", item.dataset.cat === name);
  });
}

/* =================================
   PRODUCT DETAILS
================================= */

function openProductDetail(productId) {
  const product = PRODUCTS.find(function(item) {
    return item.id === productId;
  });

  if (product) {
    // Replace this alert when a product detail page is available.
    alert("Selected product: " + product.name);
  }
}

/* =================================
   ADD TO CART
================================= */

function quickAddToCart(event, productId) {
  event.stopPropagation();

  const product = PRODUCTS.find(function(item) {
    return item.id === productId;
  });

  if (!product) return;

  activeSelectedProduct = product;
  tempSelectedColor = null;

  renderColorStep();
  document.getElementById("productModalOverlay").classList.add("active");
}

function renderColorStep() {
  const product = activeSelectedProduct;
  if (!product) return;

  if (product.colors && product.colors.length > 0) {
    const contentHtml = `
      <div class="option-group">
        <div class="option-label">Select Color</div>

        <div class="option-values-column">
          ${product.colors.map(function(color) {
            return `
              <button class="option-btn"
                      onclick="onColorSelected('${safeText(color)}')">
                ${safeText(color)}
              </button>
            `;
          }).join("")}
        </div>
      </div>
    `;

    document.getElementById("modalOptionsContent").innerHTML = contentHtml;
  } else {
    renderSizeStep(null);
  }
}

function onColorSelected(color) {
  tempSelectedColor = color;
  renderSizeStep(color);
}

function renderSizeStep(color) {
  const product = activeSelectedProduct;
  if (!product) return;

  if (product.sizes && product.sizes.length > 0) {
    const contentHtml = `
      <div class="option-group">
        <div class="option-label">Select Size</div>

        <div class="option-values-column">
          ${product.sizes.map(function(size) {
            return `
              <button class="option-btn"
                      onclick="onSizeSelected('${safeText(size)}')">
                ${safeText(size)}
              </button>
            `;
          }).join("")}
        </div>
      </div>
    `;

    document.getElementById("modalOptionsContent").innerHTML = contentHtml;
  } else {
    finalizeAddToCart(color, null);
  }
}

function onSizeSelected(size) {
  finalizeAddToCart(tempSelectedColor, size);
}

function finalizeAddToCart(color, size) {
  if (!activeSelectedProduct) return;

  const cartItem = {
    ...activeSelectedProduct,
    selectedColor: color,
    selectedSize: size
  };

  cart.push(cartItem);

  try {
    localStorage.setItem("larel_cart", JSON.stringify(cart));
  } catch (error) {
    console.error("Unable to save cart:", error);
  }

  updateCartCount();
  closeProductModal();
  showToast("Added to cart successfully!");
}

/* =================================
   MODAL
================================= */

function closeProductModal() {
  document.getElementById("productModalOverlay").classList.remove("active");
  document.getElementById("modalOptionsContent").innerHTML = "";

  activeSelectedProduct = null;
  tempSelectedColor = null;
}

document.getElementById("productModalOverlay").addEventListener("click", function(event) {
  if (event.target === this) {
    closeProductModal();
  }
});

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    closeProductModal();
  }
});

/* =================================
   TOAST
================================= */

let toastTimer;

function showToast(message) {
  const toast = document.getElementById("toastNotification");

  document.getElementById("toastMessage").textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(function() {
    toast.classList.remove("show");
  }, 2500);
}

/* =================================
   MOBILE MENU
================================= */

const menuBtn = document.getElementById("menu-btn");
const navbar = document.getElementById("navbar");
const overlay = document.getElementById("menu-overlay");

function toggleMenu() {
  navbar.classList.toggle("active");
  overlay.classList.toggle("active");
}

menuBtn.addEventListener("click", toggleMenu);
overlay.addEventListener("click", toggleMenu);

navbar.querySelectorAll("a").forEach(function(link) {
  link.addEventListener("click", function() {
    navbar.classList.remove("active");
    overlay.classList.remove("active");
  });
});

/* =================================
   INITIALIZE
================================= */

renderShop();
openTab("tshirts");
</script>

</body>
</html>
